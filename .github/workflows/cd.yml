name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Full Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and Dependencies
        run: |
          pip install uv
          uv sync --project backend

      - name: Run Backend Pytest Suite
        env:
          TRIAGE_PROVIDER: simulated
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          cd backend
          uv run pytest --cov=app --cov-fail-under=65

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm ci
          npm test

      - name: Run Submission Pre-Flight Checks
        run: |
          python scripts/check_submission.py

  build-push:
    name: Build & Push to GHCR (Tagged by SHA)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Normalized Repository Name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Backend Image
        id: push-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest

      - name: Build and Push Frontend Image
        id: push-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/frontend:latest

      - name: Install Syft SBOM CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SPDX SBOM for Backend
        run: |
          syft ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }} -o spdx-json=backend-sbom.spdx.json

      - name: Generate SPDX SBOM for Frontend
        run: |
          syft ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }} -o spdx-json=frontend-sbom.spdx.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            backend-sbom.spdx.json
            frontend-sbom.spdx.json

  deploy-k8s:
    name: Ephemeral Kubernetes Deployment Verification
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Normalized Repository Name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create Kind Ephemeral Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: civicpulse-cd-cluster
          wait: 120s

      - name: Set up Kustomize
        shell: bash
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION="v5.6.0"
          curl -fsSL \
            -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install VPA CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/master/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml

      - name: Patch Overlays with Immutable SHA Image Reference
        run: |
          cd k8s/overlays/prod
          kustomize edit set image backend=ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          kustomize edit set image frontend=ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}

      - name: Apply Kubernetes Production Overlay
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Wait for Rollout Status
        run: |
          echo "Awaiting deployment rollout completion..."
          kubectl rollout status deployment/prod-backend -n civicpulse --timeout=180s || true
          kubectl rollout status deployment/prod-frontend -n civicpulse --timeout=180s || true

      - name: Cluster Smoke Test and Status Capture
        run: |
          echo "Cluster Pods:"
          kubectl get pods -n civicpulse -o wide
          echo "Cluster Services:"
          kubectl get services -n civicpulse
          echo "Cluster Ingress & Autoscalers:"
          kubectl get ingress -n civicpulse || true
          kubectl get hpa -n civicpulse || true
