name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Lint & Type Check (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and Backend Dependencies
        run: |
          pip install uv
          uv sync --project backend

      - name: Run Ruff Linter & Formatter Check
        run: |
          cd backend
          uv run ruff check app tests
          uv run ruff format --check app tests

      - name: Run Mypy Type Checker
        run: |
          cd backend
          uv run mypy app

      - name: Four-Layer Architecture Import Boundary Guard
        run: |
          echo "Verifying routes layer does not import SQLAlchemy directly..."
          python3 -c "
          import pathlib, sys
          routes = list(pathlib.Path('backend/app/routes').glob('*.py'))
          violations = []
          for r in routes:
              content = r.read_text(encoding='utf-8')
              if 'from sqlalchemy' in content or 'import sqlalchemy' in content:
                  violations.append(str(r))
          if violations:
              print(f'Architecture boundary violation: Routes importing SQLAlchemy: {violations}', file=sys.stderr)
              sys.exit(1)
          print('Layer separation verified: routes consume service layer cleanly.')
          "

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linter (oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

  test-backend:
    name: Backend Pytest Suite (Coverage >= 65%)
    needs: lint-and-type
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and Backend Dependencies
        run: |
          pip install uv
          uv sync --project backend

      - name: Run Pytest with Coverage Gate
        run: |
          cd backend
          uv run pytest --cov=app --cov-fail-under=65

  test-frontend:
    name: Frontend Vitest Component Suite (>= 5 Tests)
    needs: lint-and-type
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Component Tests
        run: |
          cd frontend
          npm test

      - name: Verify Component Test Count >= 5
        run: |
          python3 -c "
          import pathlib, re
          tests = list(pathlib.Path('frontend/tests').glob('*.test.*'))
          count = sum(len(re.findall(r'\b(it|test)\s*\(', p.read_text(encoding='utf-8'))) for p in tests)
          print(f'Total frontend component tests verified: {count}')
          assert count >= 5, f'Expected at least 5 component tests, found {count}'
          "

  build:
    name: Build Images (No-Publish PR Gate)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:ci
          push: false

      - name: Build Frontend Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:ci
          push: false

  scan:
    name: Trivy Container Vulnerability Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild Backend Image for Scan
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:ci
          push: false

      - name: Rebuild Frontend Image for Scan
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:ci
          push: false

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  manifests:
    name: Kubeconform Manifest Validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        shell: bash
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION="v5.6.0"
          curl -fsSL \
            -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install Kubeconform
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform-linux-amd64.tar.gz

      - name: Validate Kubernetes Production Manifests
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas

  integration:
    name: Compose Integration Smoke & E2E Verification
    needs: [scan, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d

      - name: Wait for Backend Health
        run: |
          echo "Polling backend /health endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy (HTTP 200)!"
              break
            fi
            echo "Waiting for backend... ($i/30, status=$STATUS)"
            sleep 2
          done

      - name: Test End-to-End Complaint Ingestion & Triage
        run: |
          curl -s -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Severe burst water pipe flooding main commercial avenue","location":"Sector F-10 Market"}' \
            -o complaint.json
          cat complaint.json
          python3 -c "import json; res = json.load(open('complaint.json')); assert res.get('id') is not None, 'Missing complaint id'; assert res.get('category') in ['roads', 'water', 'electricity', 'waste', 'other'], f'Invalid category: {res.get(\"category\")}'; assert res.get('priority') in ['low', 'medium', 'high', 'urgent'], f'Invalid priority: {res.get(\"priority\")}'; print('E2E Complaint ingestion contract verified successfully!')"

      - name: Test Redis Cache MISS and HIT Transitions
        run: |
          echo "Request 1 to /api/stats (Expect MISS)..."
          curl -s -D headers1.txt -o /dev/null http://localhost:8000/api/stats
          H1=$(grep -i "x-cache:" headers1.txt | awk '{print $2}' | tr -d '\r\n')
          echo "First response X-Cache: $H1"

          echo "Request 2 to /api/stats (Expect HIT)..."
          curl -s -D headers2.txt -o /dev/null http://localhost:8000/api/stats
          H2=$(grep -i "x-cache:" headers2.txt | awk '{print $2}' | tr -d '\r\n')
          echo "Second response X-Cache: $H2"

          python3 -c "h1 = '$H1'.strip().upper(); h2 = '$H2'.strip().upper(); print(f'Observed cache sequence: {h1} -> {h2}'); assert 'MISS' in h1 or h1 == '', 'First request should result in MISS'; assert 'HIT' in h2, 'Second request should result in HIT'; print('Cache state transition MISS -> HIT verified!')"

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose down -v
