services:
  frontend:
    image: ${IMAGE_TAG:-frontend:latest}
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${IMAGE_TAG:-backend:latest}
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: civicpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d civicpulse"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  edge:
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
  ollama_models:
